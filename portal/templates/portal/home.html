{% extends "portal/base.html" %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-auto py-4">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5" style="background-color: var(--app-card-bg); border: 1px solid var(--app-border) !important;">
            
            <div class="text-center mb-4">
                <h1 class="h3 fw-bold tracking-tight mb-2" style="color: var(--app-text);">Вхід у систему</h1>
                <p class="text-muted small">Введіть свої дані для доступу до Task Manager</p>
            </div>

            <!-- Форма авторизації -->
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="username" class="form-label small fw-medium text-secondary">Логін / Email</label>
                    <input type="text" name="username" id="username" class="form-control rounded-3 py-2 px-3 border-light-subtle" placeholder="Ваш логін" required style="background-color: var(--app-bg); color: var(--app-text);">
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label small fw-medium text-secondary mb-0">Пароль</label>
                    </div>
                    <input type="password" name="password" id="password" class="form-control rounded-3 py-2 px-3 border-light-subtle" placeholder="••••••••" required style="background-color: var(--app-bg); color: var(--app-text);">
                </div>

                <button type="submit" class="app-btn-primary w-100 py-2 rounded-3 fw-medium text-center">
                    Увійти
                </button>
            </form>

        </div>
    </div>
</div>
{% endblock %}
