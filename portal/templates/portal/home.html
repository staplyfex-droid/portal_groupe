{% extends "portal/base.html" %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-auto py-4">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5" style="background-color: var(--app-card-bg); border: 1px solid var(--app-border) !important;">
            
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Головна сторінка</title>
                <style>
                    * {
                        box-sizing: border-box;
                        margin: 0;
                        padding: 0;
                    }

                    body {
                        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                        background-color: #f8fafc;
                        color: #0f172a;
                        height: 100vh;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        text-align: center;
                    }

                    h1 {
                        font-size: clamp(2rem, 5vw, 3.5rem);
                        font-weight: 600;
                        letter-spacing: -0.02em;
                        margin-bottom: 25px;
                    }

                    .btn-group-custom {
                        display: flex;
                        flex-direction: column;
                        gap: 12px;
                        align-items: center;
                    }

                    .btn-diary {
                        display: inline-block;
                        padding: 12px 24px;
                        background-color: #2563eb;
                        color: white;
                        text-decoration: none;
                        border-radius: 8px;
                        font-weight: 500;
                        transition: background-color 0.2s;
                        width: 100%;
                        max-width: 260px;
                    }
                    .btn-diary:hover {
                        background-color: #1d4ed8;
                    }

                    .btn-profile {
                        display: inline-block;
                        padding: 12px 24px;
                        background-color: #475569;
                        color: white;
                        text-decoration: none;
                        border-radius: 8px;
                        font-weight: 500;
                        transition: background-color 0.2s;
                        width: 100%;
                        max-width: 260px;
                    }
                    .btn-profile:hover {
                        background-color: #334155;
                    }
                </style>
            </head>
            <body>

                <h1>Головна сторінка</h1>

                <div class="btn-group-custom">
                    <a href="/diary" class="btn-diary">📓 Перейти до щоденника</a>
                    <a href="/profile" class="btn-profile">👤 Мій профіль</a>
                </div>

            </body>

        </div>
    </div>
</div>
{% endblock %}
