{% extends "portal/base.html" %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-auto py-4">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5" style="background-color: var(--app-card-bg); border: 1px solid var(--app-border) !important;">
            
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Головна сторінка</title>
                <style>
                    /* Скидання базових відступів та вирівнювання по центру */
                    * {
                        box-sizing: border-box;
                        margin: 0;
                        padding: 0;
                    }

                    body {
                        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                        background-color: #f8fafc;
                        color: #0f172a;
                        height: 100vh;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        text-align: center;
                    }

                    /* Стилізація головного надпису */
                    h1 {
                        font-size: clamp(2rem, 5vw, 3.5rem);
                        font-weight: 600;
                        letter-spacing: -0.02em;
                    }
                </style>
            </head>
            <body>

                <h1>Головна сторінка</h1>

            </body>

        </div>
    </div>
</div>
{% endblock %}
